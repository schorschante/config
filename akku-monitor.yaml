substitutions:
  name: "akku-monitor"
  friendly_name: "Akku Monitor"
  battery_min_v: "3.0"
  battery_max_v: "4.2"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

debug:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: "esphome123"

captive_portal:

web_server:
  port: 80
  version: 2

# Schaltung:
#   Akku+ → R1(220kΩ) → GPIO35 → R2(100kΩ) → GND

sensor:
  - platform: uptime
    id: uptime_sensor
    internal: true
    update_interval: 60s

  - platform: adc
    pin: GPIO35
    name: "Akku Spannung"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: never
    samples: 16
    filters:
      - multiply: 3.2
      - lambda: |-
          ESP_LOGI("cal", "Rohwert (pre-cal): %.3f V", x);
          return x;
      - calibrate_linear:
          - 3.059 -> 3.0
          - 3.373 -> 3.3
          - 3.578 -> 3.5
          - 3.782 -> 3.7 
          - 3.990 -> 3.9
          - 4.173 -> 4.1
          - 4.291 -> 4.2
    state_class: measurement
    icon: "mdi:battery"

  - platform: template
    name: "Akku Ladung"
    id: battery_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    state_class: measurement
    device_class: battery
    icon: "mdi:battery-80"
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v) || v <= 0) return NAN;
      float pct = (v - ${battery_min_v}) / (${battery_max_v} - ${battery_min_v}) * 100.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

interval:
  - interval: 10s
    then:
      - component.update: battery_voltage
      - component.update: battery_percent

text_sensor:
  - platform: debug
    reset_reason:
      name: "Letzter Reset-Grund"
      icon: "mdi:restart-alert"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"

  - platform: template
    name: "Uptime"
    icon: "mdi:clock-outline"
    update_interval: 60s
    lambda: |-
      uint32_t secs = (uint32_t) id(uptime_sensor).state;
      uint32_t h = secs / 3600;
      uint32_t m = (secs % 3600) / 60;
      if (h > 0)
        return {str_sprintf("%dh %dm", h, m)};
      return {str_sprintf("%dm", m)};
