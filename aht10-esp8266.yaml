substitutions:
  name: "aht10-sensor"
  friendly_name: "AHT10 Sensor"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  reboot_timeout: 15min
  min_auth_mode: WPA2

  ap:
    ssid: "AHT10 Sensor Hotspot"
    password: "esphome123"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2

i2c:
  sda: GPIO4
  scl: GPIO5

debug:

sensor:
  - platform: aht10
    variant: AHT10
    temperature:
      name: "Temperatur"
      device_class: temperature
      state_class: measurement
    humidity:
      name: "Luftfeuchtigkeit"
      device_class: humidity
      state_class: measurement
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Letzter Reset-Grund"
      icon: "mdi:restart-alert"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
