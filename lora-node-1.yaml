esphome:
  name: lora-node-1
  friendly_name: LoRa Node 1

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: '24'

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  ap:
    ssid: "LoRa Node 1"
    password: "lora1234"

web_server:
  port: 80
  version: 2

debug:

globals:
  - id: last_rssi
    type: float
    initial_value: '0.0'
  - id: last_snr
    type: float
    initial_value: '0.0'
  - id: packet_count
    type: int
    initial_value: '0'
  - id: last_packet_millis
    type: uint32_t
    initial_value: '0'

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  dio0_pin: GPIO26
  cs_pin: GPIO18
  rst_pin: GPIO14
  pa_pin: BOOST
  pa_power: 14
  modulation: LORA
  frequency: 868.1MHz
  bandwidth: 125_0kHz
  spreading_factor: 12
  coding_rate: CR_4_8
  crc_enable: true
  sync_value: 0x12
  preamble_size: 8
  rx_start: true
  on_packet:
    then:
      - lambda: |-
          id(last_rssi) = rssi;
          id(last_snr) = snr;
          id(packet_count) += 1;
          id(last_packet_millis) = millis();
          char hex[256];
          ESP_LOGD("lora", "packet %s", format_hex_to(hex, x));
          ESP_LOGD("lora", "rssi %.2f dBm  snr %.2f dB", rssi, snr);
          id(lora_rssi_sensor).publish_state(rssi);
          id(lora_snr_sensor).publish_state(snr);
          id(lora_last_packet).publish_state(format_hex(x));

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: template
    name: "LoRa RSSI"
    id: lora_rssi_sensor
    unit_of_measurement: "dBm"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:signal"
  - platform: template
    name: "LoRa SNR"
    id: lora_snr_sensor
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:sine-wave"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Letzter Reset-Grund"
      icon: "mdi:restart-alert"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"

  - platform: template
    name: "LoRa Last Packet"
    id: lora_last_packet
    icon: "mdi:message-text"
  - platform: template
    name: "LoRa Last Packet Age"
    id: lora_last_time
    icon: "mdi:clock-outline"
    update_interval: 1s
    lambda: |-
      uint32_t secs = id(last_packet_millis) == 0
        ? millis() / 1000
        : (millis() - id(last_packet_millis)) / 1000;
      if (secs < 60)
        return {str_sprintf("kein Paket seit %ds", secs)};
      else if (secs < 3600)
        return {str_sprintf("kein Paket seit %dm %ds", secs/60, secs%60)};
      else
        return {str_sprintf("kein Paket seit %dh %dm", secs/3600, (secs%3600)/60)};

button:
  - platform: restart
    name: "Neustart"
    id: restart_btn
    internal: true

  - platform: template
    name: "LoRa: Testpaket senden"
    on_press:
      then:
        - sx127x.send_packet:
            data: [0xC5, 0x51, 0x78, 0x82, 0xB7, 0xF9, 0x9C, 0x5C]

interval:
  - interval: 6min
    then:
      - if:
          condition:
            lambda: |-
              return id(packet_count) > 0 &&
                     (millis() - id(last_packet_millis)) > 360000;
          then:
            - logger.log:
                level: WARN
                format: "Watchdog: Kein Paket seit 6min, neustart..."
            - delay: 1s
            - button.press: restart_btn
